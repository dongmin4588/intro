<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김동민 | Profile</title>
    <style>
        :root {
            --primary-navy: #1a2a6c;
            --accent-gold: #f1c40f;
            --bg-light: #f4f7f6;
            --text-dark: #333;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* 상단 헤더 */
        header {
            background: linear-gradient(135deg, var(--primary-navy), #2c3e50);
            color: var(--white);
            padding: 50px 20px;
            text-align: center;
        }

        /* 사진이 무조건 보이도록 설정 */
        .profile-img-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 15px;
            border-radius: 50%;
            border: 4px solid var(--accent-gold);
            overflow: hidden;
            background-color: #ddd;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        header h1 { margin: 0; font-size: 2.2rem; }
        header p { margin: 5px 0 0; opacity: 0.8; }

        /* 메인 컨텐츠: 한 블록씩 구분 */
        main {
            max-width: 750px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-block {
            background: var(--white);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        h2 {
            font-size: 1.3rem;
            color: var(--primary-navy);
            border-bottom: 2px solid var(--accent-gold);
            display: inline-block;
            margin-bottom: 25px;
            padding-bottom: 5px;
        }

        /* 1. 개요 블록 */
        .overview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .info-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        .info-label { font-weight: bold; color: #777; font-size: 0.95rem; }
        .info-value { color: var(--text-dark); font-size: 0.95rem; }

        /* 2. 좋아하는 것 블록 */
        .interest-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }
        .interest-item {
            text-align: center;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
            width: 100px;
        }
        .interest-emoji { font-size: 2rem; display: block; margin-bottom: 5px; }

        /* 3. 연혁 블록 */
        .timeline { border-left: 2px solid #e0e0e0; padding-left: 25px; margin-left: 10px; }
        .timeline-item { position: relative; margin-bottom: 20px; }
        .timeline-item::before {
            content: ''; position: absolute; left: -31px; top: 6px;
            width: 12px; height: 12px; background: var(--accent-gold); border-radius: 50%;
        }
        .timeline-date { font-weight: bold; color: #888; font-size: 0.85rem; display: block; }
        .timeline-desc { font-size: 1rem; color: #444; }

        /* 4. 목표 블록 */
        .goal-block {
            background: #fdfdfd;
            border: 2px solid var(--primary-navy);
            text-align: center;
            padding: 30px;
            border-radius: 15px;
        }
        .goal-label { font-size: 0.85rem; color: var(--primary-navy); font-weight: bold; margin-bottom: 10px; display: block; }
        .goal-text { font-size: 1.5rem; font-weight: 800; color: var(--primary-navy); margin: 0; }

        @media (max-width: 550px) {
            .overview-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
